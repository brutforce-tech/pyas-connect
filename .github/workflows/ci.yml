name: CI

# Every push and pull request: build every package, run every test, and hold
# the bundle to its budget. The end-to-end suite needs a Pyas API (readme), so it
# is not run here.
on:
  push:
    # The epic and every feature branch, on each push.
    branches: [master, connect-v2, 'v2/**']
  workflow_dispatch:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # The component tests run in Stencil's own DOM; no browser download needed.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run size

