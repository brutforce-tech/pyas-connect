name: CI

# Every push and pull request: build every package, run every test, and hold
# the bundle to its budget (plan §59).
on:
  push:
    branches: [master, connect-v2]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # The component tests run in Stencil's own DOM; no browser download needed.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run size
