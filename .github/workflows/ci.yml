name: CI

# Every push and pull request: build every package, run every test, and hold
# the bundle to its budget (plan §59).
on:
  push:
    branches: [master, connect-v2]
  workflow_dispatch:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # The component tests run in Stencil's own DOM; no browser download needed.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run size

  e2e:
    # The widget in the React, Vue and Angular examples and the playground, against the real API
    # (pyas-api's e2e server in its own database, providers played in-process), checked out at the
    # branch of the same name when it has one, else at api-v2. Screenshots are Windows baselines,
    # checked locally: here every journey and every axe check runs, screenshots ignored.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Which pyas-api branch
        id: refs
        env:
          TOKEN: ${{ secrets.PYAS_CI_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/brutforce-tech/pyas-api.git" "$BRANCH" > /dev/null 2>&1; then echo "api=$BRANCH" >> "$GITHUB_OUTPUT"; else echo "api=api-v2" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        with:
          path: pyas-connect
      - uses: actions/checkout@v4
        with:
          repository: brutforce-tech/pyas-api
          ref: ${{ steps.refs.outputs.api }}
          token: ${{ secrets.PYAS_CI_TOKEN }}
          path: pyas-api
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the API and start its test databases
        working-directory: pyas-api
        run: npm ci --no-audit --no-fund && npm run test:db:up
      - name: Build every package
        working-directory: pyas-connect
        run: npm ci && npm run build
      - name: Journeys and accessibility
        working-directory: pyas-connect
        env:
          CI: '1'
          PYAS_API_DIR: ${{ github.workspace }}/pyas-api
        run: npx playwright test --ignore-snapshots
      - name: The report, when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: connect-e2e-report
          path: |
            pyas-connect/e2e/.report
            pyas-connect/e2e/.results
          retention-days: 7
